name: Daily job hunt

on:
  schedule:
    - cron: "17 0 * * *"   # 00:17 UTC = 07:17 Vietnam time, every day
  workflow_dispatch: {}      # "Run workflow" button for manual runs

permissions:
  contents: write            # needed to commit data/seen.json back

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm start
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save seen jobs
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "job-hunter-bot@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "chore: update seen jobs"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: output/*.md
          retention-days: 14
